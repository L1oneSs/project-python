<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title description">
<title id="title">C4: контейнеры экспериментального стенда</title>
<desc id="description">Исследователь работает с браузерным приложением. Оно получает ресурсы от nginx, отправляет измерения в FastAPI и загружает модели. FastAPI использует PostgreSQL и Ollama. Bootstrap подготавливает модель Ollama.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526277"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif} .edge{fill:none;stroke:#526277;stroke-width:2;stroke-linejoin:round;marker-end:url(#arrow)} .boundary{fill:none;stroke:#a2adba;stroke-width:1.5;stroke-dasharray:7 5} .label{fill:#334155;font-size:14px;paint-order:stroke;stroke:white;stroke-width:5px;stroke-linejoin:round} .heading{fill:#22334a;font-weight:700;font-size:18px} .node-title{fill:white;font-weight:700;font-size:18px} .node-type{fill:#e7effa;font-size:12px} .node-desc{fill:white;font-size:14px}</style>
